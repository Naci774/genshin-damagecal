<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>简易计算器</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f4f9; }
    .calculator { width: 240px; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    #display { grid-column: span 4; height: 45px; text-align: right; font-size: 24px; padding: 5px 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { height: 45px; font-size: 18px; border: none; background: #e0e0e0; border-radius: 5px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #d0d0d0; }
    button.operator { background: #ff9500; color: white; }
    button.operator:hover { background: #e08500; }
  </style>
</head>
<body>

<div class="calculator">
  <input type="text" id="display" readonly>
  <button onclick="clearDisplay()">C</button>
  <button class="operator" onclick="append('/')">/</button>
  <button class="operator" onclick="append('*')">*</button>
  <button class="operator" onclick="append('-')">-</button>
  <button onclick="append('7')">7</button>
  <button onclick="append('8')">8</button>
  <button onclick="append('9')">9</button>
  <button class="operator" onclick="append('+')">+</button>
  <button onclick="append('4')">4</button>
  <button onclick="append('5')">5</button>
  <button onclick="append('6')">6</button>
  <button class="operator" onclick="calculate()" style="grid-row: span 2; height: 100px;">=</button>
  <button onclick="append('1')">1</button>
  <button onclick="append('2')">2</button>
  <button onclick="append('3')">3</button>
  <button onclick="append('0')" style="grid-column: span 2;">0</button>
  <button onclick="append('.')">.</button>
</div>

<script>
  const display = document.getElementById('display');

  function append(val) { display.value += val; }
  function clearDisplay() { display.value = ''; }
  function calculate() {
    try {
      display.value = Function('"use strict"; return (' + display.value + ')')();
    } catch {
      display.value = 'Error';
    }
  }
</script>

</body>
</html>
