<!-- 第二区块：敌人基础面板 (抗性模式与免疫开关) -->
<div class="card">
  <div class="card-title">敌人基础面板</div>

  <div class="form-row">
    <label for="enemy-lvl">敌人等级</label>
    <input type="number" id="enemy-lvl" value="90">
  </div>

  <!-- 抗性模式 Toggle (Off: 简略 / On: 4排4列详细) -->
  <div class="toggle-wrapper">
    <span class="toggle-label">详细抗性调整</span>
    <label class="switch">
      <input type="checkbox" id="res-toggle" onchange="toggleResMode(this.checked)">
      <span class="slider"></span>
    </label>
  </div>

  <!-- 1排2列 简略统一抗性 -->
  <div id="unified-res-box" class="form-row">
    <div class="input-group" style="align-items: center;">
      <span style="font-size: 13px; color: #4e5969; width: 90px;">全抗性 (%)</span>
      <input type="number" value="10" placeholder="默认 10%">
    </div>
  </div>

  <!-- 4排4列 详细独立抗性 (火元素、水元素、冰元素、雷元素、风元素、岩元素、草元素、物理) -->
  <div id="detailed-res-box" style="display: none;" class="res-grid-detailed">
    <!-- 第 1 排 -->
    <div class="res-item"><span>火元素抗性:</span><input type="number" value="10"></div>
    <div class="res-item"><span>水元素抗性:</span><input type="number" value="10"></div>
    <!-- 第 2 排 -->
    <div class="res-item"><span>冰元素抗性:</span><input type="number" value="10"></div>
    <div class="res-item"><span>雷元素抗性:</span><input type="number" value="10"></div>
    <!-- 第 3 排 -->
    <div class="res-item"><span>风元素抗性:</span><input type="number" value="10"></div>
    <div class="res-item"><span>岩元素抗性:</span><input type="number" value="10"></div>
    <!-- 第 4 排 -->
    <div class="res-item"><span>草元素抗性:</span><input type="number" value="10"></div>
    <div class="res-item"><span>物理抗性:</span><input type="number" value="10"></div>
  </div>

  <div class="form-row" style="margin-top: 12px;">
    <label for="enemy-element">敌人固有/当前元素附着</label>
    <select id="enemy-element">
      <option value="none">无附着 (无元素)</option>
      <option value="pyro">火元素</option>
      <option value="hydro">水元素</option>
      <option value="dendro">草元素</option>
      <option value="electro">雷元素</option>
      <option value="cryo">冰元素</option>
      <option value="anemo">风元素</option>
      <option value="geo">岩元素</option>
    </select>
  </div>

  <!-- 元素免疫 Toggle 开关与 7排1列 展开列表 -->
  <div class="toggle-wrapper" style="margin-top: 12px;">
    <span class="toggle-label">元素免疫设定</span>
    <label class="switch">
      <input type="checkbox" id="immune-toggle" onchange="toggleImmuneList(this.checked)">
      <span class="slider"></span>
    </label>
  </div>

  <!-- 7排1列 元素免疫勾选列表 -->
  <div id="immune-list-box" style="display: none;" class="immune-list">
    <div class="immune-item"><span>火元素免疫</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
    <div class="immune-item"><span>水元素免疫</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
    <div class="immune-item"><span>冰元素免疫</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
    <div class="immune-item"><span>雷元素免疫</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
    <div class="immune-item"><span>风元素免疫</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
    <div class="immune-item"><span>岩元素免疫</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
    <div class="immune-item"><span>草元素免疫</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
  </div>

</div>
