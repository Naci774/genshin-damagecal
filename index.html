<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>原神伤害计算器</title>
  <style>
    /* 1. 全局样式重置与背景 */
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      color: #1f2329;
    }

    h1 { text-align: center; margin-bottom: 20px; font-size: 24px; color: #1d2129; }

    /* 2. 三栏主容器布局 */
    .calculator-layout {
      display: grid;
      grid-template-columns: 320px 1fr 380px; /* 左-中-右 比例 */
      gap: 20px;
      max-width: 1600px;
      margin: 0 auto;
    }

    @media (max-width: 1200px) {
      .calculator-layout { grid-template-columns: 1fr; }
    }

    /* 3. 通用卡片样式 */
    .card {
      background: #ffffff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 15px;
      font-weight: bold;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 2px solid #e5e6eb;
      color: #165dff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title .tag {
      font-size: 12px;
      font-weight: normal;
      background: #f2f3f5;
      color: #86909c;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* 4. 表单基础元素 */
    .form-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .form-row label { font-size: 13px; color: #4e5969; font-weight: 500; }
    
    .input-group { display: flex; gap: 6px; }

    input, select {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #c9cdd4;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      background-color: #fff;
    }

    input:focus, select:focus { border-color: #165dff; }

    /* Toggle 开关组件样式 (Off/On 灰变蓝) */
    .toggle-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .toggle-label { font-size: 13px; font-weight: 500; color: #4e5969; }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #c9cdd4; /* Off 状态为灰色 */
      transition: .3s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #165dff; /* On 状态为蓝色 */
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* 圣遗物卡片样式 (4排2列副词条) */
    .artifact-item {
      border: 1px solid #e5e6eb;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .artifact-name {
      font-size: 13px;
      font-weight: bold;
      color: #1d2129;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .sub-stat-table {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sub-stat-row {
      display: grid;
      grid-template-columns: 1.3fr 1fr; /* 1列: 类型, 2列: 数值 */
      gap: 6px;
